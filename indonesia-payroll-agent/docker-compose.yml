services:
  postgres:
    image: postgres:18
    container_name: indonesia-payroll-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: indonesia_payroll_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indonesia_payroll_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
